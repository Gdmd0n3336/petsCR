# Версии actions сверены по GitHub Releases (2026-10-13): actions/checkout v7.0.1, actions/setup-node v7.1.0.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Сборка без переменных: нет ключей Google и адресов Supabase, образец данных в отдельном чанке.
      - run: npm run check:bundle
      - run: npm audit --audit-level=high
