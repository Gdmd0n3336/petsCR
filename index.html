<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F5" />
    <!-- Палитра до первой отрисовки (design/DESIGN.md §9): только tishina или teplo. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('lapa.theme') === 'teplo' ? 'teplo' : 'tishina';
      } catch (e) {
        document.documentElement.dataset.theme = 'tishina';
      }
    </script>
    <title>Lapa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
